<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<title>stock5-0 차트 기능 검증 — 모의 API</title>
<div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import App from '../src/App.jsx';

  // Use synthetic data to check controls without credentials or market requests.
  window.fetch = async input => {
    const url = new URL(String(input), location.href);
    let payload;
    if (url.pathname.endsWith('/quote')) {
      payload = { price: 160, change: 1, changePct: .63 };
    } else if (url.pathname.endsWith('/top100')) {
      const count = url.searchParams.get('market') === 'nikkei' ? 50 : 100;
      payload = { items: Array.from({ length: count }, (_, i) => ({
        symbol: `TEST${i + 1}`, name: `검증 종목 ${i + 1}`, rank: i + 1,
      })) };
    } else if (url.pathname.endsWith('/ohlcv')) {
      const weekly = url.searchParams.get('interval') === 'week';
      await new Promise(resolve => setTimeout(resolve, weekly ? 30 : 180));
      payload = Array.from({ length: 350 }, (_, i) => {
        const close = 100 + i * .2 + Math.sin(i / 8) * 8;
        return {
          time: new Date(Date.UTC(weekly ? 2018 : 2024, 0, 1 + i * (weekly ? 7 : 1))).toISOString().slice(0, 10),
          open: close - 1, high: close + 3, low: close - 3, close,
          volume: 10000 + i * 50,
        };
      });
    } else {
      payload = [];
    }
    return new Response(JSON.stringify(payload), { headers: { 'Content-Type': 'application/json' } });
  };
  createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</html>
