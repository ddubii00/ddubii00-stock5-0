<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<title>stock5-0 차트 기능 검증 — 모의 API</title>
<div id="root"></div>
<output id="ranking-api-status" hidden></output>
<output id="financial-api-status" hidden></output>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import App from '../src/App.jsx';

  const historyBars = new URL(location.href).searchParams.get('history') === 'short' ? 120 : 2400;
  const rankingRetry = new URL(location.href).searchParams.get('ranking') === 'retry';
  const longNames = new URL(location.href).searchParams.get('names') === 'long';
  const financialSortTest = new URL(location.href).searchParams.get('financialSort') === '1';
  const financialStats = { requests: 0, active: 0, maximum: 0 };
  const saveDelay = Math.min(10000, Math.max(0, Number(new URL(location.href).searchParams.get('saveDelay')) || 0));
  const saveFailure = new URL(location.href).searchParams.get('save') === 'fail';
  const rankingStats = { requests: 0, aborted: 0, completed: 0, failed: 0 };
  const reportRanking = () => {
    document.querySelector('#ranking-api-status').textContent = JSON.stringify(rankingStats);
  };
  const delay = (milliseconds, signal) => new Promise((resolve, reject) => {
    if (signal?.aborted) {
      reject(new DOMException('Aborted', 'AbortError'));
      return;
    }
    const cancel = () => {
      clearTimeout(timer);
      reject(new DOMException('Aborted', 'AbortError'));
    };
    const timer = setTimeout(() => {
      signal?.removeEventListener('abort', cancel);
      resolve();
    }, milliseconds);
    signal?.addEventListener('abort', cancel, { once: true });
  });

  // Market data is synthetic; shared-state checks use an isolated real test server.
  const serverFetch = window.fetch.bind(window);
  window.fetch = async (input, options = {}) => {
    const { signal } = options;
    const url = new URL(String(input), location.href);
    if (url.pathname.endsWith('/state')) {
      if (options.method === 'PATCH') {
        await delay(saveDelay, signal);
        if (saveFailure) return new Response(JSON.stringify({ error: '검증용 저장 오류' }), {
          status: 503, headers: { 'Content-Type': 'application/json' },
        });
      }
      return serverFetch(input, options);
    }
    if (['/ma200-scan', '/line-break-scan', '/cloud-scan', '/ma-cross-scan', '/common-scan'].some(path => url.pathname.endsWith(path))) return serverFetch(input, options);
    let payload;
    if (url.pathname.endsWith('/quote')) {
      payload = { price: 160, change: 1, changePct: .63 };
    } else if (url.pathname.endsWith('/search') && url.searchParams.get('q') === 'rank-alternate') {
      payload = [{ symbol: 'ALTERNATE', name: '순위 밖 검증 종목' }];
    } else if (url.pathname.endsWith('/fundamentals')) {
      payload = { symbol: url.searchParams.get('symbol').toUpperCase(), pe: 7.52, forwardPe: 4.74,
        roe: .4415, forwardRoe: 1.0318, pbr: 4.57, peg: .01, pegEstimated: true,
        marketCap: 1232e12, revenue: 97.1e12, operatingIncome: 47.2e12,
        currency: 'KRW', source: 'synthetic-test-only', periodType: '연간', period: '2025' };
      if (financialSortTest) {
        const symbol = payload.symbol, index = Number(symbol.match(/\d+$/)?.[0] || 0);
        const offset = symbol.startsWith('KOSPI') ? 0 : symbol.startsWith('KOSDAQ') ? 100 : symbol.startsWith('NASDAQ') ? 200 : 300;
        const value = index % 10 === 1 ? null : 500 - offset - index;
        financialStats.requests++; financialStats.active++; financialStats.maximum = Math.max(financialStats.maximum, financialStats.active);
        document.querySelector('#financial-api-status').textContent = JSON.stringify(financialStats);
        await delay(35, signal);
        financialStats.active--;
        document.querySelector('#financial-api-status').textContent = JSON.stringify(financialStats);
        Object.assign(payload, { pe: value, forwardPe: value, roe: value === null ? null : value / 1000,
          forwardRoe: value === null ? null : value / 1000, pbr: value, peg: value,
          marketCap: value === null ? null : value * 1e10, revenue: value === null ? null : value * 1e10,
          operatingIncome: value === null ? null : (value - 200) * 1e10 });
      }
    } else if (url.pathname.endsWith('/top100')) {
      rankingStats.requests += 1;
      reportRanking();
      try {
        await delay(600, signal);
      } catch (error) {
        rankingStats.aborted += 1;
        reportRanking();
        throw error;
      }
      if (rankingRetry && rankingStats.requests === 1) {
        rankingStats.failed += 1;
        reportRanking();
        return new Response(JSON.stringify({ error: '검증용 순위 API 오류' }), {
          status: 502, headers: { 'Content-Type': 'application/json' },
        });
      }
      rankingStats.completed += 1;
      reportRanking();
      const count = url.searchParams.get('market') === 'nikkei' ? 50 : 100;
      payload = { items: Array.from({ length: count }, (_, i) => ({
        symbol: `TEST${i + 1}`, name: longNames ? `검증용 긴 종목명 한미반도체 ${i + 1}` : `검증 종목 ${i + 1}`, rank: i + 1,
      })) };
    } else if (url.pathname.endsWith('/ohlcv')) {
      const weekly = url.searchParams.get('interval') === 'week';
      await delay(weekly ? 30 : 180, signal);
      const date = new Date(Date.UTC(weekly ? 1980 : 2015, 0, 1));
      payload = Array.from({ length: historyBars }, (_, i) => {
        if (i) date.setUTCDate(date.getUTCDate() + (weekly ? 7 : 1));
        if (!weekly) {
          while ([0, 6].includes(date.getUTCDay())) date.setUTCDate(date.getUTCDate() + 1);
        }
        const close = 100 + i * .2 + Math.sin(i / 8) * 8;
        return {
          time: date.toISOString().slice(0, 10),
          open: close - 1, high: close + 3, low: close - 3, close,
          volume: 10000 + i * 50,
        };
      }).slice(-Number(url.searchParams.get('limit') || 350));
    } else {
      payload = [];
    }
    return new Response(JSON.stringify(payload), { headers: { 'Content-Type': 'application/json' } });
  };
  createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</html>
